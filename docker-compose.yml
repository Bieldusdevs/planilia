version: '3.8'

services:
  # ===== DATABASE =====
  postgres:
    image: postgres:16-alpine
    container_name: lingerie-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lingerie_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - lingerie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== BACKEND =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingerie-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lingerie_db?schema=public
      - JWT_SECRET=${JWT_SECRET:-lingerie_dona_lingerie_secret_key_2024}
      - FRONTEND_URL=http://localhost:3000
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lingerie-network
    restart: unless-stopped

  # ===== FRONTEND =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lingerie-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - lingerie-network
    restart: unless-stopped

  # ===== NGINX (Reverse Proxy) =====
  nginx:
    image: nginx:alpine
    container_name: lingerie-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lingerie-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  lingerie-network:
    driver: bridge
